<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KBO Agency Dashboard</title>
    <meta name="description" content="KBO baseball agency dashboard for salary negotiation and player management with AI insights." />
    <meta property="og:title" content="KBO Agency Dashboard" />
    <meta property="og:description" content="KBO baseball agency dashboard for salary negotiation and player management with AI insights." />
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        const desc = Object.getOwnPropertyDescriptor(window, 'fetch');
        if (desc && !desc.set && desc.configurable) {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(val) { console.warn('Ignored attempt to overwrite window.fetch'); },
            configurable: true
          });
        }
      } catch (e) {
        console.error('Failed to patch fetch:', e);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
